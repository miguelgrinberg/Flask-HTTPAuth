[testenv]
commands=
    pip install -e .
    pytest -p no:logging --cov=src --cov-branch --cov-report=term-missing --cov-report=xml
deps=
    asgiref
    pytest
    pytest-cov

[testenv:flake8]
deps=
    flake8
commands=
    flake8 --exclude=".*" --ignore=E402 src/flask_httpauth.py tests examples

[testenv:docs]
changedir=docs
deps=
    sphinx
    furo
allowlist_externals=
    make
commands=
    make html
